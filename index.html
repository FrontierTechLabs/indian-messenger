<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indian Messenger · Offline</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#060B16;color:#fff;font-family:Inter,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;padding:16px}
    .container{max-width:480px;width:100%;background:#0F172A;border-radius:32px;padding:24px;border:1px solid #FF993322}
    .brand{font-size:24px;font-weight:900;color:#FF9933;text-align:center}
    .sub{font-size:10px;color:#666;text-align:center;letter-spacing:2px;margin-bottom:16px}
    .room-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
    .room-bar input{flex:1;padding:8px 12px;border-radius:40px;border:1px solid #2A3A5A;background:#1A2440;color:#fff;outline:none}
    .room-bar button{padding:8px 16px;border-radius:40px;border:none;background:#FF9933;color:#060B16;font-weight:700;cursor:pointer}
    .room-bar .room-name{font-weight:600;color:#FF9933;font-size:14px}
    .chat-area{height:350px;overflow-y:auto;margin:12px 0;padding-right:4px;display:flex;flex-direction:column;gap:6px}
    .chat-area::-webkit-scrollbar{width:4px}
    .chat-area::-webkit-scrollbar-thumb{background:#FF993355;border-radius:10px}
    .msg{padding:10px 14px;border-radius:14px;max-width:85%;word-wrap:break-word;font-size:14px}
    .msg-other{background:#1A2440;align-self:flex-start}
    .msg-you{background:#FF9933;color:#060B16;align-self:flex-end}
    .msg .name{font-size:10px;opacity:0.6;margin-bottom:2px}
    .msg .status{font-size:8px;opacity:0.4;margin-top:2px}
    .flex{display:flex;gap:8px}
    .input-row{flex:1;padding:12px 16px;border-radius:60px;background:#1A2440;border:1px solid #2A3A5A;color:#fff;outline:none;font-size:14px}
    .input-row:focus{border-color:#FF9933}
    .send-btn{padding:12px 24px;border-radius:60px;border:none;background:#FF9933;color:#060B16;font-weight:700;cursor:pointer;font-size:14px}
    .send-btn:hover{background:#E8831A}
    .hidden{display:none}
    .username-input{width:100%;padding:12px 16px;border-radius:14px;background:#1A2440;border:1px solid #2A3A5A;color:#fff;font-size:14px;margin-top:8px;outline:none}
    .btn-join{width:100%;padding:14px;border-radius:60px;border:none;background:#FF9933;color:#060B16;font-weight:700;font-size:16px;cursor:pointer;margin-top:12px}
    .offline-badge{display:inline-block;background:#FF4D4D22;border:1px solid #FF4D4D44;padding:2px 12px;border-radius:40px;font-size:10px;color:#FF4D4D;margin-left:8px}
    .online-badge{display:inline-block;background:#2ECC7122;border:1px solid #2ECC7144;padding:2px 12px;border-radius:40px;font-size:10px;color:#2ECC71;margin-left:8px}
  </style>
</head>
<body>
<div class="container">
  <div class="brand">🇮🇳 Indian Messenger</div>
  <div class="sub">POWERED BY SOVEREIGN AI MESH</div>

  <div id="login">
    <input class="username-input" id="usernameInput" placeholder="Enter your username..." />
    <button class="btn-join" id="joinBtn">Join the Mesh</button>
  </div>

  <div id="chat" class="hidden">
    <div class="room-bar">
      <span class="room-name" id="roomDisplay">📌 Lobby</span>
      <span id="onlineStatus" class="online-badge">● Online</span>
      <input id="roomInput" placeholder="Room name" />
      <button id="joinRoomBtn">Join</button>
      <button id="createRoomBtn">Create</button>
    </div>
    <div class="chat-area" id="messages"></div>
    <div class="flex">
      <input class="input-row" id="msgInput" placeholder="Type a message..." />
      <button class="send-btn" id="sendBtn">Send</button>
    </div>
  </div>
</div>
<script>
// ----- IndexedDB Helpers -----
const DB_NAME = 'IndianMessenger';
const STORE_NAME = 'messages';
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveMessageToDB(message) {
  if (!db) db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.add({ ...message, synced: false });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getUnsyncedMessages() {
  if (!db) db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result.filter(m => !m.synced));
    req.onerror = () => reject(req.error);
  });
}

async function markSynced(id) {
  if (!db) db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.get(id);
    req.onsuccess = () => {
      const msg = req.result;
      if (msg) {
        msg.synced = true;
        store.put(msg);
      }
      resolve();
    };
    req.onerror = () => reject(req.error);
  });
}

// ----- Main App -----
let ws, user, currentRoom = 'Lobby';
let isOnline = navigator.onLine;
const loginDiv = document.getElementById('login');
const chatDiv = document.getElementById('chat');
const usernameInput = document.getElementById('usernameInput');
const joinBtn = document.getElementById('joinBtn');
const messagesDiv = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const roomInput = document.getElementById('roomInput');
const joinRoomBtn = document.getElementById('joinRoomBtn');
const createRoomBtn = document.getElementById('createRoomBtn');
const roomDisplay = document.getElementById('roomDisplay');
const onlineStatus = document.getElementById('onlineStatus');

function updateOnlineStatus() {
  isOnline = navigator.onLine;
  if (isOnline) {
    onlineStatus.className = 'online-badge';
    onlineStatus.textContent = '● Online';
  } else {
    onlineStatus.className = 'offline-badge';
    onlineStatus.textContent = '● Offline';
  }
}

window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);

function addMessageToUI(username, text, isYou, status = 'sent') {
  const div = document.createElement('div');
  div.className = 'msg ' + (isYou ? 'msg-you' : 'msg-other');
  div.innerHTML = `<div class="name">${username}</div>${text}<div class="status">${status}</div>`;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

joinBtn.addEventListener('click', async () => {
  user = usernameInput.value.trim() || 'Guest';
  loginDiv.classList.add('hidden');
  chatDiv.classList.remove('hidden');
  updateOnlineStatus();

  // Open IndexedDB
  db = await openDB();

  // Register Service Worker
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('/sw.js');
      console.log('Service Worker registered');
    } catch (e) {
      console.warn('SW registration failed', e);
    }
  }

  // WebSocket connection
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${window.location.host}`);
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'init') {
      messagesDiv.innerHTML = '';
      data.messages.forEach(msg => addMessageToUI(msg.username, msg.text, msg.username === user, 'sent'));
      roomDisplay.textContent = '📌 ' + data.room;
      currentRoom = data.room;
    } else if (data.type === 'message') {
      if (data.room === currentRoom) {
        addMessageToUI(data.message.username, data.message.text, data.message.username === user, 'sent');
      }
      // Mark as synced in IndexedDB if it was ours
      // In a full implementation, we'd track by ID
    }
  };
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'set_username', username: user }));
    ws.send(JSON.stringify({ type: 'join_room', room: 'Lobby' }));
    // Sync queued messages
    syncQueuedMessages();
  };
  ws.onclose = () => {
    // Auto-reconnect logic
    setTimeout(() => {
      // Reconnect
    }, 2000);
  };

  window.user = user;
  window.syncQueuedMessages = syncQueuedMessages;
});

async function syncQueuedMessages() {
  if (!isOnline || !ws) return;
  const unsynced = await getUnsyncedMessages();
  for (const msg of unsynced) {
    try {
      ws.send(JSON.stringify({ type: 'message', text: msg.text }));
      await markSynced(msg.id);
      // Update UI status
    } catch (e) {
      console.warn('Sync failed', e);
    }
  }
}

sendBtn.addEventListener('click', async () => {
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = '';

  const messageData = { username: user, text, room: currentRoom, timestamp: Date.now() };

  if (!isOnline || !ws) {
    // Offline: save to IndexedDB and show pending
    await saveMessageToDB(messageData);
    addMessageToUI(user, text, true, 'pending');
    return;
  }

  // Online: send via WebSocket
  ws.send(JSON.stringify({ type: 'message', text }));
  addMessageToUI(user, text, true, 'sent');
});

msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendBtn.click(); });

joinRoomBtn.addEventListener('click', () => {
  const room = roomInput.value.trim() || 'Lobby';
  if (!ws) return;
  ws.send(JSON.stringify({ type: 'join_room', room }));
  currentRoom = room;
  roomDisplay.textContent = '📌 ' + room;
  roomInput.value = '';
});

createRoomBtn.addEventListener('click', () => {
  const room = roomInput.value.trim() || 'NewRoom';
  if (!ws) return;
  ws.send(JSON.stringify({ type: 'join_room', room }));
  currentRoom = room;
  roomDisplay.textContent = '📌 ' + room;
  roomInput.value = '';
});

// Listen for sync messages from Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'sync_queued') {
      if (isOnline && ws && ws.readyState === WebSocket.OPEN) {
        syncQueuedMessages();
      }
    }
  });
}
</script>
</body>
</html>
